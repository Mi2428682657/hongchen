<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红尘问道 · 成就攻略</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23141620'/%3E%3Ctext x='12' y='17' font-size='14' text-anchor='middle' fill='%23c9a35c' font-family='serif'%3E道%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#14161f;
    --bg2:#1b1e2a;
    --card:#20243a;
    --card2:#262b44;
    --ink:#e8e3d5;
    --ink-dim:#a9a7b8;
    --gold:#c9a35c;
    --gold-deep:#a8833f;
    --line:rgba(201,163,92,.22);
    --ok:#7fb069;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:radial-gradient(1200px 600px at 50% -100px, rgba(201,163,92,.09), transparent 60%), var(--bg);
    color:var(--ink);
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif;
    min-height:100vh;
    line-height:1.6;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 16px 80px}

  /* ===== 头部 ===== */
  header{
    text-align:center;
    padding:34px 12px 26px;
    border-bottom:1px solid var(--line);
    margin-bottom:22px;
  }
  h1{
    font-size:clamp(28px,5vw,44px);
    letter-spacing:.12em;
    color:var(--gold);
    font-weight:700;
    text-shadow:0 0 24px rgba(201,163,92,.25);
  }
  .sub{
    margin-top:10px;color:var(--ink-dim);font-size:14px;letter-spacing:.08em;
  }
  .stats{
    display:flex;justify-content:center;gap:28px;margin-top:16px;flex-wrap:wrap;
  }
  .stats div{font-size:13px;color:var(--ink-dim)}
  .stats b{display:block;font-size:24px;color:var(--gold);font-weight:700}

  /* ===== 控件区 ===== */
  .controls{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    margin:18px 0 14px;
  }
  input,select{
    background:var(--bg2);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:inherit;
    font-size:16px;
    border-radius:8px;
    padding:10px 14px;
    min-height:44px;
    outline:none;
  }
  input:focus,select:focus{border-color:var(--gold)}
  input{flex:1;min-width:200px}
  select{flex:0 0 auto}
  .count{font-size:13px;color:var(--ink-dim);margin-left:auto;white-space:nowrap}

  /* ===== 篇章 Tab ===== */
  .tabs{
    display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;
  }
  .tab{
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-dim);
    font-family:inherit;
    font-size:15px;
    padding:10px 16px;
    min-height:44px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .tab:hover{border-color:var(--gold);color:var(--ink)}
  .tab.active{
    background:var(--gold);
    color:#14161f;
    border-color:var(--gold);
    font-weight:700;
  }

  /* ===== 成就卡片 ===== */
  .achv{
    background:var(--card);
    border:1px solid var(--line);
    border-left:3px solid var(--gold);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:12px;
  }
  .achv-head{
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    cursor:pointer;
    user-select:none;
  }
  .achv-idx{
    font-size:13px;color:var(--gold-deep);
    letter-spacing:.1em;
  }
  .achv-name{
    font-size:clamp(16px,2.5vw,19px);
    font-weight:700;letter-spacing:.06em;
    flex:1;min-width:150px;
  }
  .achv-name .tgl{display:inline-block;width:1.2em;color:var(--ink-dim);font-size:12px;letter-spacing:0}
  .req{
    display:inline-flex;gap:6px;align-items:center;
  }
  .req span{
    font-size:12px;
    padding:3px 9px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--ink-dim);
  }
  .req span b{color:var(--gold);font-weight:700;margin-right:2px}
  .req span.ji b{color:#7fb0c9}

  /* ===== 步骤链 ===== */
  .steps{
    margin-top:12px;
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    border-top:1px dashed var(--line);
    padding-top:12px;
  }
  .step{
    background:var(--bg2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 11px;
    font-size:13.5px;
    color:var(--ink);
    letter-spacing:.04em;
  }
  .step:first-child{border-color:var(--gold);color:var(--gold)}
  .arrow{color:var(--gold-deep);font-size:13px;user-select:none}

  .empty{
    text-align:center;color:var(--ink-dim);padding:48px 12px;font-size:15px;
  }

  footer{
    text-align:center;color:var(--ink-dim);font-size:12px;margin-top:36px;
    letter-spacing:.06em;
  }
  footer .note{color:var(--ink-dim);font-size:11px;margin-top:4px;opacity:.7}

  @media (max-width:640px){
    .wrap{padding:16px 10px 60px}
    header{padding:22px 8px 18px}
    .achv{padding:12px 12px}
    .count{margin-left:0;width:100%}
    .req{margin-left:0}
  }
</style>
</head>

let cur = 0;
const tabsEl = document.getElementById("tabs");
const listEl = document.getElementById("list");
const searchEl = document.getElementById("search");
const wuEl = document.getElementById("wuFilter");
const countEl = document.getElementById("count");

// 悟性筛选选项（全部篇章去重排序）
const wuSet = new Set();
DATA.forEach(ch => ch.items.forEach(it => wuSet.add(it.w)));
[...wuSet].sort((a,b)=>a-b).forEach(w => {
  const o = document.createElement("option");
  o.value = w; o.textContent = "悟性 ≥ " + w;
  wuEl.appendChild(o);
});

function renderTabs(){
  tabsEl.innerHTML = "";
  DATA.forEach((ch,i) => {
    const b = document.createElement("button");
    b.className = "tab" + (i===cur?" active":"");
    b.textContent = ch.chapter;
    b.setAttribute("aria-pressed", i===cur);
    b.addEventListener("click", () => { cur = i; renderAll(); });
    tabsEl.appendChild(b);
  });
}

function filterItems(){
  const q = searchEl.value.trim();
  const w = wuEl.value ? parseInt(wuEl.value,10) : 0;
  return DATA[cur].items.filter(it => {
    if (w && it.w < w) return false;
    if (q && !it.name.includes(q)) return false;
    return true;
  });
}

function renderAll(){
  renderTabs();
  const items = filterItems();
  countEl.textContent = "当前显示 " + items.length + " / " + DATA[cur].items.length;
  listEl.innerHTML = "";
  if (!items.length){
    listEl.innerHTML = '<div class="empty">没有符合条件的成就，换个筛选试试</div>';
    return;
  }
  items.forEach(it => {
    const card = document.createElement("div");
    card.className = "achv closed";
    const reqW = it.w ? '<span><b>悟</b>' + it.w + '</span>' : '';
    const reqJ = it.j ? '<span class="ji"><b>缘</b>' + it.j + '</span>' : '';
    const stepsHtml = it.s.map((st,i) =>
      (i?'<span class="arrow">→</span>':'') + '<span class="step">'+st+'</span>'
    ).join("");
    card.innerHTML =
      '<div class="achv-head" role="button" tabindex="0" aria-expanded="false">' +
        '<span class="achv-idx">第' + it.n + '章</span>' +
        '<span class="achv-name">' + it.name + '<span class="tgl">▾</span></span>' +
        '<span class="req">' + reqW + reqJ + '</span>' +
      '</div>' +
      '<div class="steps">' + stepsHtml + '</div>';
    const head = card.querySelector(".achv-head");
    const toggle = () => {
      const open = card.classList.toggle("open");
      card.classList.toggle("closed", !open);
      head.setAttribute("aria-expanded", open);
      card.querySelector(".tgl").textContent = open ? "▾" : "▸";
    };
    head.addEventListener("click", toggle);
    head.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" ") { e.preventDefault(); toggle(); } });
    listEl.appendChild(card);
  });
}

searchEl.addEventListener("input", renderAll);
wuEl.addEventListener("change", renderAll);
renderAll();
</script>
